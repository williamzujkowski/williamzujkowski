name: Update Terminal SVG

# Regenerates the profile hero terminal from terminal.yml and terminal-mobile.yml
# using the published svg-terminal GitHub Action (williamzujkowski/svg-terminal@v1).
#
# Four responsive outputs:
#   - src/terminal.svg                animated desktop (default)
#   - src/terminal-static.svg         static desktop (prefers-reduced-motion)
#   - src/terminal-mobile.svg         animated mobile (max-width: 600px)
#   - src/terminal-mobile-static.svg  static mobile (max-width: 600px + reduced-motion)

on:
  # Every 6 hours (~midnight/6/noon/6pm EST). Daily theme rotation + live data.
  schedule:
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'terminal.yml'
      - 'terminal-mobile.yml'
      - '.github/workflows/update-terminal-svg.yml'

permissions:
  contents: write

concurrency:
  group: update-terminal-svg
  cancel-in-progress: true

jobs:
  update-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York   # day-of-year theme rotation flips at EST midnight

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Generate Desktop Animated SVG
        uses: williamzujkowski/svg-terminal@v1
        with:
          config: terminal.yml
          output: src/terminal.svg
          strict: 'true'

      - name: Generate Desktop Static SVG
        uses: williamzujkowski/svg-terminal@v1
        with:
          config: terminal.yml
          output: src/terminal-static.svg
          static: 'true'
          strict: 'true'

      - name: Generate Mobile Animated SVG
        uses: williamzujkowski/svg-terminal@v1
        with:
          config: terminal-mobile.yml
          output: src/terminal-mobile.svg
          strict: 'true'

      - name: Generate Mobile Static SVG
        uses: williamzujkowski/svg-terminal@v1
        with:
          config: terminal-mobile.yml
          output: src/terminal-mobile-static.svg
          static: 'true'
          strict: 'true'

      - name: Commit updated SVGs
        run: |
          set -euo pipefail
          if git diff --quiet src/terminal.svg src/terminal-static.svg src/terminal-mobile.svg src/terminal-mobile-static.svg; then
            echo "No SVG changes across all 4 targets — nothing to commit."
            exit 0
          fi
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add src/terminal.svg src/terminal-static.svg src/terminal-mobile.svg src/terminal-mobile-static.svg
          git commit -m "chore: update desktop and mobile terminal SVGs [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
